name: CI

# Quality gate for pull requests to main. These jobs are the REQUIRED status
# checks in branch protection, so they run on EVERY PR (no path filter) to always
# report a result — otherwise a required check that never runs would block merges.
# Actual deployment lives in deploy-backend.yml / deploy-frontend.yml (on push).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint & type-check
        run: |
          uv run ruff check .
          uv run mypy app/
      - name: Tests
        env:
          ENVIRONMENT: local
          DEMO_USER_ID: 00000000-0000-0000-0000-000000000000
        run: uv run pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type-check, lint, tests & build
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build
