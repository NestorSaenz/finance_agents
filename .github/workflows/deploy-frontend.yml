name: Deploy frontend

# On merge to main that touches frontend/, gate on types+lint+tests, then build
# & deploy to Cloud Run. Keyless auth via Workload Identity Federation.
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: read
  id-token: write # required for the WIF OIDC token

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

env:
  GCP_PROJECT: project-19dc8dc2-da3d-4f8d-834
  GCP_REGION: us-central1
  WIF_PROVIDER: projects/887687060494/locations/global/workloadIdentityPools/github-pool/providers/github-provider
  DEPLOY_SA: github-deployer@project-19dc8dc2-da3d-4f8d-834.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint & tests
        run: |
          npm run typecheck
          npm run lint
          npm test

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        # Source is the frontend/ dir (this job's working-directory). The backend
        # URL is baked as an ARG in frontend/Dockerfile, so no extra flags needed.
        run: |
          gcloud run deploy safi-frontend \
            --source . \
            --region "${GCP_REGION}" \
            --quiet
